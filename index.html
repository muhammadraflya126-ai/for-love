<!DOCTYPE html>
<html>
<head>
<title>Untuk Kamu SayangKU ❤️</title>

<style>
body {
  text-align: center;
  font-family: Arial;
  background: pink;
  color: white;
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background-color: white;
  color: hotpink;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background-color: hotpink;
  color: white;
}
</style>
</head>

<body>

<h2>💖 Hai Sayang KU ,Ini aku Rafly, Jawab yaa💖</h2>

<div id="quiz">
<p>Kamu sayang aku nggak hayoo ?</p>
<button onclick="lanjut()">Sayang ❤️</button>
<button onclick="lanjut()">Sayang banget ❤️❤️❤️</button>
</div>

<h3 id="hasil"></h3>

<script>

function lanjut() {
  document.getElementById("quiz").innerHTML = `
    <p> mau bareng terus sama aku ngga</p>
    <button onclick="akhir()">Mau 🥰</button>
    <button onclick="akhir()">Selalu Mau banget💕</button>
  `;
}

function akhir() {
  document.getElementById("quiz").innerHTML = "";
  document.getElementById("hasil").innerHTML =
  "🎉 HALLO SAYANG 🎉<br><br>Aku cuma mau bilang...<br><br>Terima kasih sudah selalu ada ❤️<br>Aku sayang kamu selamanya 💖";
}

</script>

</body>
</html>
